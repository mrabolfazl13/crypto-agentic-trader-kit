# پیکربندی دیدگاه «بورس تهران» در همان داشبورد — فقط خواندنی، فقط PAPER.
# این فایل موتور، ریسک‌گیت و چرخه‌ی paper را تغییر نمی‌دهد؛ آن‌ها روی config.yaml
# (بازار اصلی) می‌مانند. مسیرهای /api/v1/tse/* و کندل نمادهای بورس از همین فایل
# خوانده می‌شوند. برای اجرای مستقل بورس به‌عنوان بازار اصلی، همین محتوا را در
# config.yaml یک پوشه‌ی جدا بگذارید و با --root به serve بدهید.
#
# تفاوت‌های عمدی با config.yaml کریپتو:
#   * market: tse  → provider از TSETMC خوانده می‌شود، نه Gate.
#   * timeframe: 1d → TSETMC فقط تاریخچه‌ی روزانه منتشر می‌کند؛ تأیید روی 1w.
#   * آستانه‌ی تازگی و spread برای بازاری که ۱۲:۳۰ بسته می‌شود تنظیم شده است.
#   * هیچ کلید API یا اعتبارنامه‌ای اینجا نیست و TSETMC عمومی خوانده می‌شود.

app:
  name: crypto-agentic-trader
  timezone: UTC
  log_level: INFO

trading:
  market: tse                 # crypto | tse — مسیر کریپتو با همین کلید دست‌نخورده می‌ماند
  mode: PAPER                 # PAPER یا LIVE؛ برای بورس هیچ مسیر LIVE وجود ندارد
  live_trading_enabled: false # حتی با true، بازار tse به PAPER برمی‌گردد
  exchange: tsetmc
  market_type: spot
  # فهرست نمادها از universe_tse.json خوانده می‌شود (insCode عددی).
  # برای محدودکردن، در markets.tse.symbols تیکر یا insCode بنویسید.
  timeframe: 1d
  max_open_positions: 2
  allow_short: false
  allow_margin: false
  allow_leverage: false
  allow_withdrawals: false

markets:
  tse:
    max_symbols: 40           # سقف اسکن از فهرست رتبه‌بندی‌شده‌ی universe_tse.json
    watch_ttl_seconds: 20     # یک GetMarketWatch کل تابلوی بورس را کش می‌کند
    # symbols: ["فولاد", "وبملت", "46348559193224090"]  # تیکر یا insCode؛ نبودنش = استفاده از universe
    fees:
      # کارمزد ترکیبی کارگزاری برای معامله‌ی عادی؛ عدد پیش‌فرض است، نه تأییدشده.
      # نرخ دقیق حساب خود را با کارگزار بررسی کنید.
      maker_pct: 0.325
      taker_pct: 0.325

risk:
  max_account_allocation_pct: 5.0
  max_position_pct_of_allocated_capital: 20.0
  max_risk_per_trade_pct: 0.5
  max_daily_loss_pct: 1.5
  max_weekly_loss_pct: 4.0
  max_drawdown_pct: 8.0
  max_trades_per_day: 4
  # spread تابلوی بورس معمولاً ۰.۲–۱٪ است؛ ۰.۳٪ پیش‌فرض کریپتو بیشتر نمادها را رد می‌کند.
  max_spread_pct: 3.0
  max_slippage_pct: 0.20
  min_reward_risk_ratio: 1.5
  cooldown_minutes_after_loss: 60
  # داده‌ی روزانه + تعطیلی پنجشنبه/جمعه: آستانه‌ی ۱۲۰ ثانیه‌ای کریپتو اینجا بی‌معناست.
  stop_on_data_staleness_seconds: 345600
  stop_on_consecutive_errors: 3
  allocated_capital: 1000000000  # ریال — فقط حساب کاغذی؛ این عدد را با سرمایه‌ی واقعی اشتباه نگیرید

data:
  confirm_timeframe: 1w
  fallback_exchange: ""       # بورس منبع دوم مستقل ندارد؛ cross-check عمداً خاموش است
  max_concurrency: 4
  filters_cache_seconds: 3600

strategy:
  require_multiple_signals: true
  require_market_regime_check: true
  require_fee_and_slippage_estimate: true
  confidence_threshold: 0.70
  no_trade_if_signals_conflict: true

execution:
  order_type: limit
  cancel_unfilled_after_seconds: 30
  max_retries: 2
  idempotency_required: true
  reconcile_balances_before_order: true
  verify_order_status_after_timeout: true

monitoring:
  kill_switch_file: "./STOP_TRADING"
  alert_on_order: true
  alert_on_daily_loss_limit: true
  alert_on_exchange_error: true
  daily_report: true

security:
  api_key_env: EXCHANGE_API_KEY
  api_secret_env: EXCHANGE_API_SECRET
  require_trade_only_api_key: true
  reject_withdraw_permission: true
  redact_secrets_from_logs: true
