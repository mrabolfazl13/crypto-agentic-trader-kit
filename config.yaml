  timeframe: 4h                # سیگنال روی 4h؛ اجرای زنده با quote لحظه‌ای
  max_open_positions: 2
  allow_short: false
  allow_margin: false
  allow_leverage: false
  allow_withdrawals: false

risk:
  allocated_capital: 1000.0   # سرمایه‌ی اختیاری کاغذی؛ عامل آن را افزایش نمی‌دهد
  max_account_allocation_pct: 5.0
  max_position_pct_of_allocated_capital: 20.0
  max_risk_per_trade_pct: 0.5
  max_daily_loss_pct: 1.5
  max_weekly_loss_pct: 4.0
  max_drawdown_pct: 8.0
  max_trades_per_day: 4
  max_spread_pct: 0.30
  max_slippage_pct: 0.20
  min_reward_risk_ratio: 1.5
  cooldown_minutes_after_loss: 60
  stop_on_data_staleness_seconds: 120
  stop_on_consecutive_errors: 3
  max_clock_skew_seconds: 2.0

strategy:
  require_multiple_signals: true
  require_market_regime_check: true
  require_fee_and_slippage_estimate: true
  confidence_threshold: 0.70
  no_trade_if_signals_conflict: true

execution:
  order_type: limit
  cancel_unfilled_after_seconds: 900
  max_retries: 2
  idempotency_required: true
  reconcile_balances_before_order: true
  verify_order_status_after_timeout: true

monitoring:
  kill_switch_file: "./STOP_TRADING"
  alert_on_order: true
  alert_on_daily_loss_limit: true
  alert_on_exchange_error: true
  daily_report: true

security:
  api_key_env: EXCHANGE_API_KEY
  api_secret_env: EXCHANGE_API_SECRET
  require_trade_only_api_key: true
  reject_withdraw_permission: true
  redact_secrets_from_logs: true

# هزینه‌ها: Gate 0.20% و MEXC 0.05% taker است. 0.10% حد محافظه‌کارانه‌ی میانی.
fees:
  maker_pct: 0.10
  taker_pct: 0.10

automation:
  # چرخه‌ی خودکار PAPER: هر N ساعت یک چرخه‌ی کامل (0 = خاموش). فقط در mode=PAPER و با احترام کامل به kill switch.
  # درخواست مالک (۲۰۲۶-۱۰-۲۵): شواهد دروازه‌ی B سریع‌تر جمع شود → هر ۳ ساعت. هیچ سقف ریسک/نماد/بودجه‌ای تغییر نکرد.
  paper_cycle_hours: 3
  # مرور پژوهشی: هر N روز یک گزارش تحلیل معاملات + حداکثر ۳ فرضیه‌ی آزمون‌نشده در یک حلقه (0 = خاموش)
  research_review_days: 7

quant:
  # موتور مستقل پژوهش کوانت: فقط PAPER، بدون هیچ مسیر سفارش زنده.
  enabled: true
  data_dir: "state/quant"
  universe_path: "state/quant/universe.json"
  # هفت ماه کامل تقویمی اخیر که آرشیو عمومی Binance Vision برایشان موجود است
  # (2026-10 هنوز کامل نشده و آرشیو ماهانه‌اش منتشر نشده؛ بسط 2026-10-26 برای پوشش چندرژیمی).
  months: ["2026-03", "2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09"]
  signal_timeframes: ["15m", "1h", "4h"]
  storage:
    # سقف سخت قابل‌تغییر؛ هیچ فایلی برای جا بازکردن بی‌صدا حذف نمی‌شود.
    max_total_gb: 2.5
    raw_gb: 1.2
    features_gb: 0.5
    models_gb: 0.3
    results_gb: 0.3
    reserve_gb: 0.2
  ingest:
    concurrency: 6
    retries: 3
    timeout_seconds: 90
  backtest:
    initial_capital: 10000.0
    # کارمزد taker + اسلیپیج فرضی در هر دو سمت؛ محافظه‌کارانه‌تر از کارمزد Gate.
    fee_pct: 0.10
    slippage_pct: 0.05
    position_pct: 5.0
    max_open_positions: 10
    max_hold_hours: 24
    # هر دو پیش‌فرض خاموش (0) تا نتایج ذخیره‌شده بازتولید شوند؛ روشن‌کردنشان فرضیه‌ی
    # پیش‌ثبت‌شده است، نه تیونینگ. سقف notional و محدودیت ریسک دست‌نخورده می‌مانند.
    # فعال‌سازی پیش‌ثبت‌شده (2026-10-27، پیش از هر اجرا): گیت هزینه = هدف ≥ ۲ برابر
    # هزینه‌ی رفت‌وبرگشت (0.30%) ⇒ ≥ 0.60%؛ سایزگذاری ریسک برابر = استاپ حداکثر ۱٪
    # حقوق صاحبان سهام، هرگز بالای سقف نوتینال ۵٪.
    min_edge_cost_ratio: 2.0
    risk_per_trade_pct: 1.0
    # گیت رژیم بازار (D-012): خالی = خاموش تا نتایج ذخیره‌شده بازتولید شوند. وقتی نمادی اینجا
    # باشد، ورود long فقط در کندل‌های بسته‌شده‌ای مجاز است که آن نماد بالای EMA(regime_ema) خودش
    # روی همان تایم‌فریم باشد؛ نبودِ داده‌ی نماد مرجع اجرا را متوقف می‌کند، نه اینکه گیت را بی‌صدا خاموش کند.
    regime_symbol: ""
    regime_ema: 200
  walk_forward:
    folds: 4
    test_days: 7
  loop:
    max_experiments: 12
    trials_per_experiment: 8
    min_trades: 30
    min_profit_factor: 1.10
    max_drawdown_pct: 10.0
    min_positive_fold_pct: 60
    # گیت پیش‌ثبت‌شده‌ی چرخه‌ی بعد: بازده مثبت وقتی لبه است که از buy & hold همان پنجره جلو بزند.
    require_benchmark_edge: true
    benchmark_margin_pct: 0.05
    max_minutes: 180
  ml:
    enabled: true
    horizon_hours: 4
    top_k: 5
    probability_threshold: 0.55
  deep:
    # فقط بعد از یک Baseline معتبر روشن می‌شود؛ پیش‌فرض خاموش است.
    enabled: false

data:
  primary_exchange: gate
  confirm_timeframe: 1d
  fallback_exchange: mexc
  proxy: "http://127.0.0.1:1080"   # پروکسی محلی؛ با CAT_PROXY قابل بازنویسی است (۲۰۲۶-۱۰-۲۵: قطع شد و Gate را ۱۹–۲۷ خطا کرد؛ پس از بازگشت وصل، بازگردانده شد)
  max_concurrency: 4               # اسکن ۱۰۰ نماد با حداکثر ۴ درخواست موازی (سقف سخت: ۸)
  filters_cache_seconds: 3600      # دقت قیمت/مقدار هر جفت یک ساعت کش می‌شود
