app:
  name: crypto-agentic-trader
  timezone: UTC
  log_level: INFO

trading:
  mode: PAPER                 # PAPER یا LIVE؛ پیش‌فرض هرگز تغییر نکند
  live_trading_enabled: false # فعال‌سازی نیازمند اقدام صریح مالک است
  exchange: example_exchange
  market_type: spot
  symbols:
    - BTC/USDT
    - ETH/USDT
  timeframe: 1h
  max_open_positions: 2
  allow_short: false
  allow_margin: false
  allow_leverage: false
  allow_withdrawals: false

risk:
  max_account_allocation_pct: 5.0
  max_position_pct_of_allocated_capital: 20.0
  max_risk_per_trade_pct: 0.5
  max_daily_loss_pct: 1.5
  max_weekly_loss_pct: 4.0
  max_drawdown_pct: 8.0
  max_trades_per_day: 4
  max_spread_pct: 0.30
  max_slippage_pct: 0.20
  min_reward_risk_ratio: 1.5
  cooldown_minutes_after_loss: 60
  stop_on_data_staleness_seconds: 120
  stop_on_consecutive_errors: 3

automation:
  # هر دو کار پیش‌فرض خاموش‌اند (0). فقط در mode=PAPER و با احترام کامل به kill switch اجرا می‌شوند.
  paper_cycle_hours: 0        # چرخه‌ی خودکار PAPER هر N ساعت
  research_review_days: 0     # گزارش تحلیل + حلقه با حداکثر ۳ فرضیه، هر N روز

quant:
  # Local PAPER-only research engine. No live order path, no API keys required.
  enabled: true
  data_dir: "state/quant"
  universe_path: "state/quant/universe.json"
  months: ["2026-06", "2026-07", "2026-08", "2026-09"]
  signal_timeframes: ["15m", "1h", "4h"]
  storage:
    max_total_gb: 2.5
    raw_gb: 1.2
    features_gb: 0.5
    models_gb: 0.3
    results_gb: 0.3
    reserve_gb: 0.2
  ingest:
    concurrency: 6
    retries: 3
    timeout_seconds: 90
  backtest:
    initial_capital: 10000.0
    fee_pct: 0.10
    slippage_pct: 0.05
    position_pct: 5.0
    max_open_positions: 10
    max_hold_hours: 24
  walk_forward:
    folds: 4
    test_days: 7
  loop:
    max_experiments: 12
    trials_per_experiment: 8
    min_trades: 30
    min_profit_factor: 1.10
    max_drawdown_pct: 10.0
    min_positive_fold_pct: 60
    # Pre-registered for the next cycle: positive net return must also beat buy & hold
    # on the validation slice and on the walk-forward sum.
    require_benchmark_edge: true
    benchmark_margin_pct: 0.05
    max_minutes: 180
  ml:
    enabled: true
    horizon_hours: 4
    top_k: 5
    probability_threshold: 0.55
  deep:
    enabled: false

data:
  confirm_timeframe: 1d
  fallback_exchange: mexc
  max_concurrency: 4
  filters_cache_seconds: 3600

strategy:
  require_multiple_signals: true
  require_market_regime_check: true
  require_fee_and_slippage_estimate: true
  confidence_threshold: 0.70
  no_trade_if_signals_conflict: true

execution:
  order_type: limit
  cancel_unfilled_after_seconds: 30
  max_retries: 2
  idempotency_required: true
  reconcile_balances_before_order: true
  verify_order_status_after_timeout: true

monitoring:
  kill_switch_file: "./STOP_TRADING"
  alert_on_order: true
  alert_on_daily_loss_limit: true
  alert_on_exchange_error: true
  daily_report: true

security:
  api_key_env: EXCHANGE_API_KEY
  api_secret_env: EXCHANGE_API_SECRET
  require_trade_only_api_key: true
  reject_withdraw_permission: true
  redact_secrets_from_logs: true
