name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-quant.txt
      # The quant test module skips itself when the research stack is absent, so a
      # half-installed laptop still gets a usable base suite. CI must never take that
      # path: the stack is asserted here instead of trusting the skip.
      - name: Research stack is installed
        run: python -c "import optuna, pyarrow, lightgbm, sklearn, psutil; print('quant stack OK')"
      # The portable suite is offline by design: no exchange calls, no API keys.
      # The 22 marked research-state tests validate real PAPER evidence snapshots that are
      # deliberately excluded from git. They remain runnable locally with the owner's state/.
      - name: Report research-state acceptance tests
        run: python -m pytest --collect-only -q -m requires_research_state
      - name: Safety and engine tests
        run: python -m pytest -q -rs -m "not requires_research_state"
      - name: Run research-state acceptance tests when the private evidence bundle is present
        run: |
          if [ -d state/quant/results ] && [ -f state/reports/server_platform_snapshot.sqlite3 ]; then
            python -m pytest -q -m requires_research_state
          else
            echo "::notice::Research-state acceptance tests were not run: private runtime evidence is not part of this public repository. Run them locally with the original state/ directory."
          fi
      - name: Refuse any live order path in default config
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from cat.config import load_config
          cfg = load_config(root=".")
          assert cfg.mode == "PAPER", f"default mode must be PAPER, got {cfg.mode}"
          assert not cfg.live_trading_enabled, "live must be off by default"
          assert not cfg.owner_confirmed, "no owner record may exist in CI"
          assert not cfg.allow_withdrawals and not cfg.allow_margin and not cfg.allow_leverage
          print("live-gate defaults OK")
          PY
      - name: Audit chain integrity
        run: |
          python - <<'PY'
          import sys, tempfile, pathlib
          sys.path.insert(0, "src")
          from cat.audit import AuditLog
          root = pathlib.Path(tempfile.mkdtemp())
          log = AuditLog(root / "state" / "audit" / "events.jsonl")
          log.append("synthetic", {"ok": True}, mode="PAPER")
          ok, detail = log.verify()
          assert ok, f"audit chain must verify: {detail}"
          print("audit chain OK:", detail)
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 14
